syntax = "proto3";

package stats.message;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

message SimilarEventsRequestProto {
  int64 event_id = 1; // id мероприятия, для которого нужно найти похожие мероприятия
  int64 user_id = 2; // id пользователя, для которого из выдачи нужно исключить мероприятия, с которыми он уже взаимодействовал
  int32 max_results = 3; // ограничение количества мероприятий в результате выполнения запроса
}