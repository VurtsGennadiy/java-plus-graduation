syntax = "proto3";

package stats.message;

option java_multiple_files = true;
option java_package = "ru.practicum.ewm.stats.proto";

message UserPredictionsRequestProto {
  int64 user_id = 1; // id пользователя, для которого вычисляются рекомендации
  int32 max_results = 2; // ограничение количества мероприятий в результате выполнения запроса
}