server:
  port: ${SERVER_PORT:0}

grpc:
  server:
    port: ${GRPC_SERVER_PORT:0}

collector:
  kafka:
    producer:
      properties:
        bootstrap.servers: localhost:9092
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: ru.practicum.ewm.stats.serialization.avro.GeneralAvroSerializer
      topics:
        user-actions: stats.user-actions.v1

logging:
  file:
    name: logs/${spring.application.name}.log
  level:
    ru.practicum.ewm.stats: TRACE