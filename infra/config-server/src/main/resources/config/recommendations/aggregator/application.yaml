server:
  port: ${SERVER_PORT:0}

aggregator:
  kafka:
    consumer:
      properties:
        enable.auto.commit: true
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        key.deserializer: org.apache.kafka.common.serialization.StringDeserializer
        value.deserializer: ru.practicum.ewm.stats.serialization.avro.UserActionAvroDeserializer
        group.id: stats.aggregator
        auto.offset.reset: latest # читать данные с конца топика (для новой группы, у которой не зафиксирован офсет)
        max.poll.interval.ms: 300000 # максимальное значение таймаута между запросами на выборку
        max.poll.records: 500
      topic: stats.user-actions.v1
      pool-timeout: 10000ms # таймаут пуллинга

    producer:
      properties:
        bootstrap.servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        key.serializer: org.apache.kafka.common.serialization.StringSerializer
        value.serializer: ru.practicum.ewm.stats.serialization.avro.GeneralAvroSerializer
      topic: stats.events-similarity.v1

logging:
  file:
    name: logs/${spring.application.name}.log
  level:
    ru.practicum.ewm.stats: TRACE