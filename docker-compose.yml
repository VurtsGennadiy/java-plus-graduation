services:

  # ----- Database -----

  database:
    image: postgres:latest
    container_name: ewm-postgres
    ports:
      - "5433:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql
      - ./init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_DB=ewm_main_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    healthcheck:
      test: pg_isready -q -d $$POSTGRES_DB -U $$POSTGRES_USER
      timeout: 5s
      interval: 5s
      retries: 10

  # ----- Cloud Services -----

  discovery-server:
    container_name: ewm-discovery-server
    build: ./infra/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 12s

  config-server:
    container_name: ewm-config-server
    build: ./infra/config-server
    ports:
      - "8762:8762"
    environment:
      - SERVER_PORT=8762
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8762/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway-server:
    container_name: ewm-gateway-server
    build: ./infra/gateway-server
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  #  ----- Stats -----

  stats-server:
    build: ./stats/stats-server
    container_name: stats-server
    ports:
      - "9090:9090"
    depends_on:
      database:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=database
      - SERVER_PORT=9090
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ----- Core Services -----

  event-service:
    build: ./core/event-service
    container_name: event-service
    ports:
      - "8763:8763"
    depends_on:
      database:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=database
      - SERVER_PORT=8763
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8763/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  request-service:
    build: ./core/request-service
    container_name: request-service
    ports:
      - "8764:8764"
    depends_on:
      database:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=database
      - SERVER_PORT=8764
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8764/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  subscription-service:
    build: ./core/subscription-service
    container_name: subscription-service
    ports:
      - "8765:8765"
    depends_on:
      database:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=database
      - SERVER_PORT=8765
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8765/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  user-service:
    build: ./core/user-service
    container_name: user-service
    ports:
      - "8766:8766"
    depends_on:
      database:
        condition: service_healthy
      config-server:
        condition: service_healthy
    environment:
      - POSTGRES_HOST=database
      - SERVER_PORT=8766
      - EUREKA_SERVER_URL=http://discovery-server:8761/eureka/
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8766/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ----- Рекомендательный сервис -----

  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8088:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'